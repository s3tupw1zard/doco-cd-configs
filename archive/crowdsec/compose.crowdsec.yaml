services:

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    hostname: crowdsec
    restart: always
    ports:
      - 127.0.0.1:9876:8080 # port mapping for local firewall bouncers
    expose:
      - 8080 # http api for bouncers
      - 6060 # metrics endpoint for prometheus
      - 7422 # appsec waf endpoint
    volumes:
      # crowdsec container data
      - /srv/security/crowdsec/data:/var/lib/crowdsec/data
      - /srv/security/crowdsec/etc:/etc/crowdsec
      # log bind mounts into crowdsec
      #- /var/log/auth.log:/var/log/auth.log:ro
      #- /var/log/syslog:/var/log/syslog:ro
      - /srv/logs/traefik/access.log:/var/log/traefik/access.log:ro

    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/sshd crowdsecurity/linux crowdsecurity/appsec-generic-rules crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs
      #- CUSTOM_HOSTNAME=my-crowdsec-host123
    networks:
      - traefik

networks:
  traefik:
    external: true
