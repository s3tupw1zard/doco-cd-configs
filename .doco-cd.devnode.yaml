# Replace INFISICAL_PROJECT_ID with the new project UUID before deployment.
# Verify the Production environment slug (assumed prod).
name: searxng
working_dir: apps/searxng
compose_files:
  - compose.searxng.yaml
remove_orphans: false
force_image_pull: false
external_secrets:
  SEARXNG_SECRET: INFISICAL_PROJECT_ID:prod:/searxng/SEARXNG_SECRET
