version: 2

updates:
  # SearXNG
  - package-ecosystem: "docker-compose"
    directory: "/apps/searxng"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "dependabot"
      - "automation"
      - "web-search"
    groups:
      searxng:
        patterns:
          - "valkey/valkey"
          - "searxng/searxng"
        update-types:
          - "minor"
          - "patch"

  # doco-cd
  - package-ecosystem: "docker-compose"
    directory: "/apps/doco-cd"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "dependabot"
      - "core"
      - "gitops"
    groups:
      doco-cd:
        patterns:
          - "*kimdre/doco-cd"
        update-types:
          - "minor"
          - "patch"
