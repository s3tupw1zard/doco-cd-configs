services:
  traefik:
    container_name: traefik
    image: traefik:v3.8@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedheaders.trustedips=${TRAEFIK_TRUSTED_PROXY_IP:?required}/32
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - traefik
      - socket
    depends_on:
      - socket-proxy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  socket-proxy:
    container_name: traefik-docker-socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:latest@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
networks:
  traefik:
    external: true
  socket:
    internal: true
