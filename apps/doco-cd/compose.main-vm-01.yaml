services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.118.0@sha256:8a1d8ba96a90af2d7bcd8e9ae5f0ef4c99835e28167b3d566ebbb86a8e65c053
    container_name: doco-cd
    hostname: doco-cd
    restart: always
    environment:
      POLL_CONFIG: |
        - url: ${POLL_CONFIG_REPO_URL}
          reference: main
          interval: 300
          target: main-vm-01
      SECRET_PROVIDER: ${SECRET_PROVIDER}
      SECRET_PROVIDER_SITE_URL: ${SECRET_PROVIDER_SITE_URL}
      SECRET_PROVIDER_CLIENT_ID: ${SECRET_PROVIDER_CLIENT_ID}
      SECRET_PROVIDER_CLIENT_SECRET: ${SECRET_PROVIDER_CLIENT_SECRET}
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN}
      TZ: Europe/Berlin
      DOCKER_SWARM_FEATURES: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/data
    labels:
      - "traefik.enable=false"

volumes:
  data: