services:
  searxng:
    image: searxng/searxng:latest@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?required}
      SEARXNG_BASE_URL: https://search.s3tupw1zard.dev/
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - cache:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  valkey:
    image: valkey/valkey:9-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1"]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  cache:
  valkey:
