services:
  litellm:
    image: ghcr.io/berriai/litellm:1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.litellm.rule: Host(`api.s3tupw1zard.dev`)
      traefik.http.routers.litellm.entrypoints: web
      traefik.http.routers.litellm.service: litellm
      traefik.http.services.litellm.loadbalancer.server.port: "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?required}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:?required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?required}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?required}@postgres:5432/litellm
      PROXY_BASE_URL: ${PROXY_BASE_URL:?required}
      GENERIC_CLIENT_ID: ${GENERIC_CLIENT_ID:?required}
      GENERIC_CLIENT_SECRET: ${GENERIC_CLIENT_SECRET:?required}
      GENERIC_AUTHORIZATION_ENDPOINT: ${GENERIC_AUTHORIZATION_ENDPOINT:?required}
      GENERIC_TOKEN_ENDPOINT: ${GENERIC_TOKEN_ENDPOINT:?required}
      GENERIC_USERINFO_ENDPOINT: ${GENERIC_USERINFO_ENDPOINT:?required}
      GENERIC_SCOPE: "openid profile email"
      GENERIC_CLIENT_USE_PKCE: "true"
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_EMAIL_ATTRIBUTE: email
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      UI_USERNAME: ${UI_USERNAME:?required}
      UI_PASSWORD: ${UI_PASSWORD:?required}
      OPENCODE_GO_API_BASE: ${OPENCODE_GO_API_BASE:?required}
      SEARXNG_API_BASE: ${SEARXNG_API_BASE:?required}
      STORE_MODEL_IN_DB: "True"
      PYTHONPATH: /app
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./opencode_guard.py:/app/opencode_guard.py:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres:

networks:
  traefik:
    external: true
