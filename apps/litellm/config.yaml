# Staged configuration: verify upstream IDs and endpoints before activation.
model_list:
  - model_name: go-deepseek-v4.1-flash
    litellm_params:
      model: opencode_go/deepseek-v4.1-flash
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-mimo-v2.6-flash
    litellm_params:
      model: opencode_go/mimo-v2.6-flash
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-glm-5.3-flash
    litellm_params:
      model: opencode_go/glm-5.3-flash
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-glm-5.3
    litellm_params:
      model: opencode_go/glm-5.3
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-qwen3.8-flash
    litellm_params:
      model: opencode_go/qwen3.8-flash
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-qwen3.7-plus
    litellm_params:
      model: opencode_go/qwen3.7-plus
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-minimax-m3
    litellm_params:
      model: opencode_go/minimax-m3
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: go-longcat-2.0
    litellm_params:
      model: opencode_go/longcat-2.0
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: chat-glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-deepseek-v4.1-flash-1017
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-mimo-v2.6-flash
    litellm_params:
      model: openrouter/xiaomi/mimo-v2.6-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: "none"
  - model_name: chat-gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: "none"
search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: os.environ/SEARXNG_API_BASE
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  forward_client_headers_to_llm_api: false
  disable_env_credential_login: true
litellm_settings:
  callbacks:
    - opencode_guard.proxy_handler_instance
  drop_params: false
  turn_off_message_logging: true
  num_retries: 0
router_settings:
  num_retries: 0
  timeout: 600
  fallbacks: []
