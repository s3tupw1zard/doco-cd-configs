services:
  plane-db:
    image: postgres:15.18-alpine
    container_name: plane-db
    hostname: plane-db
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/ops/plane/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - plane-internal

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: plane-redis
    hostname: plane-redis
    volumes:
      - /srv/ops/plane/redis:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - plane-internal

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    hostname: plane-mq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - /srv/ops/plane/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - plane-internal

  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    hostname: plane-minio
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - /srv/ops/plane/minio:/export
    restart: always
    networks:
      - plane-internal

  plane-minio-init:
    image: minio/mc:latest
    container_name: plane-minio-init
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    depends_on:
      plane-minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set plane http://plane-minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}"; do
          sleep 2
        done
        mc mb --ignore-existing "plane/$${AWS_S3_BUCKET_NAME}"
    restart: "no"
    networks:
      - plane-internal

  plane:
    image: makeplane/plane-aio-community:v1.4.1
    container_name: plane
    hostname: plane
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      APP_PROTOCOL: https
      SITE_ADDRESS: :80

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AMQP_URL: ${AMQP_URL}

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}

      SECRET_KEY: ${SECRET_KEY}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

      FILE_SIZE_LIMIT: 5242880
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
    volumes:
      - /srv/ops/plane/data:/app/data
      - /srv/ops/plane/logs:/app/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio-init:
        condition: service_completed_successfully
    restart: always
    networks:
      - plane-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=cloudflare"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.scheme=http"
      - "traefik.docker.network=traefik"

  plane-init:
    image: makeplane/plane-aio-community:v1.4.1
    container_name: plane-init
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/logs/{access,error}
    volumes:
      - /srv/ops/plane/data:/app/data
      - /srv/ops/plane/logs:/app/logs
    restart: "no"


networks:
  plane-internal:
  traefik:
    external: true
