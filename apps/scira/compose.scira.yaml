services:
  scira:
    # Upstream cannot run with only the local services below. Keep disabled until supported.
    profiles: ["upstream-blocked"]
    scale: 0
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BETTER_AUTH_BASE_URL: https://scira.s3tupw1zard.dev
      ALLOWED_ORIGINS: https://scira.s3tupw1zard.dev
      MCP_OAUTH_CALLBACK_ORIGIN: https://scira.s3tupw1zard.dev
      DATABASE_URL: postgresql://scira:${POSTGRES_PASSWORD:?required}@postgres:5432/scira
      READ_DB_1: postgresql://scira:${POSTGRES_PASSWORD:?required}@postgres:5432/scira
      READ_DB_2: postgresql://scira:${POSTGRES_PASSWORD:?required}@postgres:5432/scira
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@valkey:6379/0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      CRON_SECRET: ${CRON_SECRET:?required}
      MCP_CREDENTIALS_ENCRYPTION_KEY: ${MCP_CREDENTIALS_ENCRYPTION_KEY:?required}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    labels:
      traefik.enable: "false"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scira
      POSTGRES_USER: scira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scira -d scira"]
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-ec", "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres:
  valkey:
