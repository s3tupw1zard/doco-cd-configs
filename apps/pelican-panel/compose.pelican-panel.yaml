services:
  panel:
    image: ghcr.io/pelican-dev/panel:v1.0.0-beta36@sha256:45cecf27176630ac628ebc9badc0ad273bdaa9bf441648c363dd8daeb9cc3bff
    container_name: pelican-panel
    hostname: pelican-panel
    restart: always
    networks:
      - default
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/gaming/pelican-panel/data:/pelican-data
      - /srv/gaming/pelican-panel/logs:/var/www/html/storage/logs
      - /srv/gaming/pelican-panel/Caddyfile:/etc/caddy/Caddyfile:ro
      
      # localtime mount
      - /etc/localtime:/etc/localtime:ro
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: "https://${SERVICE_DOMAIN}"
      # ADMIN_EMAIL: "${ADMIN_EMAIL}"
      BEHIND_PROXY: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=cloudflare"
      # - "traefik.http.routers.${SERVICE_NAME}.middlewares=cloudflarewarp@file,crowdsec@file"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  mariadb:
    image: mariadb:11.8
    container_name: pelican-mariadb
    hostname: pelican-mariadb
    restart: always
    ports:
      - "3306:3306"
    networks:
      - default
    environment:
      TZ: Europe/Berlin
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - "/srv/gaming/pelican-panel/mariadb/data:/var/lib/mysql"
      - "/srv/gaming/pelican-panel/mariadb/logs:/var/log/mysql"

networks:
  default:
    ipam:
      config:
        - subnet: 172.27.0.0/16
  traefik:
    external: true
