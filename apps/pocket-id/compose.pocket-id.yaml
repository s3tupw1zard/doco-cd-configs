services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
    container_name: pocket-id
    hostname: pocket-id
    restart: always
    environment:
      APP_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      TRUST_PROXY: "true"
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
#    ports:
#      - 1411:1411
    volumes:
      - "/srv/security/pocket-id/data:/app/data"
      
      # localtime mount
      - /etc/localtime:/etc/localtime:ro
    networks:
      - netbird
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=1411"
      - "traefik.docker.network=netbird"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

networks:
  netbird:
    external: true
